<div class="m3-tabs">
  <div class="tabs-header">
    @for (tab of tabs(); track tab) {
      <div
        class="tab-selector"
        [class.showed]="tab.show()"
        (click)="showTab(tab)"
      >
        <m3-icon
          class="icon"
          [weight]="600"
          [class.iconHighlighted]="tab.show()"
          [filled]="tab.show()"
          >{{ tab.icon() }}</m3-icon
        >
        <p [style.font-weight]="tab.show() ? 700 : 500">
          {{ tab.label() }}
        </p>
        <div class="moving-selector" [style.opacity]="tab.show() ? 1 : 0"></div>
      </div>
    }
  </div>
  <div class="opened-tab">
    <ng-content></ng-content>
  </div>
</div>
